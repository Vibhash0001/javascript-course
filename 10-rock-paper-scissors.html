<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <style>
        body{
            background-color: rgb(25, 25, 25);
            color: white;
            font-family: Arial, Helvetica, sans-serif;
        }

        .title{
            font-size: 30px;
            font-weight: bold;
        }

        .move-icon{
            height: 50px;
            background-color: rgb(25, 25, 25);
            border-radius: 100%;
            border-style: dotted;
            padding: 20px;

            border-width: 0px;
            color: none;
        }

        .move-btn{
            background-color: transparent;
            border-radius: 100%;
            border-width: 3px;
            border-style: solid;
            border-color: white;
            margin-right: 10px;
            cursor: pointer;
        }

        .css-result{
            font-size: 25px;
            font-weight: bold;
            margin-top: 50px;
        }

        .css-result img{
            height: 40px;
            background-color: transparent;
        }

        .reset-btn{
            padding: 10px 30px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <p class="title">Rock Paper Scissors</p>

    <button
    onclick="
        playGame('rock');
    " class="move-btn"><img src="images/rock-emoji.png" class="move-icon"></button>


    <button
    onclick="
        playGame('paper');
    " class="move-btn"><img src="images/paper-emoji.png" class="move-icon"></button>

    <button
    onclick="
        playGame('scissors');
    " class="move-btn"><img src="images/scissors-emoji.png" class="move-icon"></button>

    <p class="js-result css-result"></p>
    <p class="js-score"></p>

    <button
    onclick ="
        score.wins = 0;
        score.losses = 0;
        score.ties = 0;
        localStorage.removeItem('score');
        updateScoreElement();
        document.querySelector('.js-result').innerHTML = '';
    " class="reset-btn">Reset Score</button>
    
    <script>

        let score = JSON.parse(localStorage.getItem('score')) || {
            wins: 0,
            losses: 0,
            ties: 0
        };

        updateScoreElement();
        
        let computerMove = '';


        // if(!score){
        //     score = {
        //         wins: 0,
        //         losses: 0,
        //         ties: 0
        //     };
        // }

        // const score = {
        //     wins: 0,
        //     losses: 0,
        //     ties: 0
        // };

        // console.log(JSON.parse(localStorage.getItem('score')));

        function getResultElement(result, playerMove, computerMove){
            document.querySelector('.js-result')
                .innerHTML = (`${result}. <br> <br> You <img src="images/${playerMove}-emoji.png"> - <img src = "images/${computerMove}-emoji.png"> Computer`);
        }

        function updateScoreElement(){
            document.querySelector('.js-score')
                .innerHTML = `Wins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.ties}`;
        }

        function getComputerMove(){
            let randomNumber = Math.random();
            if(randomNumber >= 0 && randomNumber < 1/3){
                computerMove = 'rock';
            } else if(randomNumber >= 1/3 && randomNumber < 2/3){
                computerMove = 'paper';
            } else if(randomNumber >= 2/3 && randomNumber <= 1/1){
                computerMove = 'scissors'
            }
            console.log(computerMove);
        }
        
        function playGame(playerMove){
            getComputerMove();
            result = '';

            if(playerMove === 'scissors'){
                if(computerMove === 'scissors'){
                    result = 'Tie';
                } else if(computerMove === 'rock'){
                    result = 'You Lose';
                } else if(computerMove === 'paper'){
                    result = 'You Won';
                }
            } else

            if(playerMove === 'paper'){
                if(computerMove === 'paper'){
                    result = 'Tie';
                } else if(computerMove === 'scissors'){
                    result = 'You Lose';
                } else if(computerMove === 'rock'){
                    result = 'You Won';
                }
            } else

            if(playerMove === 'rock'){
                if(computerMove === 'rock'){
                    result = 'Tie';
                } else if(computerMove === 'paper'){
                    result = 'You Lose';
                } else if(computerMove === 'scissors'){
                    result = 'You Won';
                }
            }

            if(result === 'You Won'){
                score.wins++;
            }else if(result === 'You Lose'){
                score.losses++;
            }else if(result === 'Tie'){
                score.ties++;
            }

            localStorage.setItem('score', JSON.stringify(score));

            getResultElement(result, playerMove, computerMove);

            updateScoreElement();
            console.log(result);

//             alert(`You picked ${playerMove}, Computer picked ${computerMove}. ${result}
// Wins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.ties}`);
            
        }
    </script>
</body>
</html>
