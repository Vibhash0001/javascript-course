    onclick="

            computerMove = 'paper';

        }

            result = 'Tie';

            result = 'You Lose';
        } else if(computerMove === 'scissors'){
            result = 'You Won';
        }

        alert(`You picked rock, Computer picked ${computerMove}. ${result}`);
        console.log(result);

    ">Rock</button>
