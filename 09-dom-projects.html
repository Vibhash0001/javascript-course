<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Projects</title>
</head>
<body>
    <p>YouTube Subscribe Button</p>
    <button onclick="
        subscribe();
    " class="js-subscribe-btn">Subscribe</button>



    <p>Amazon Shipping Calculator</p>
    <p>Orders under $40 = +$10 shipping.</p>
    <p>Orders over $40 = FREE shipping.</p>

    <input class="js-costElement" type="number" placeholder="Cost" onkeydown="
        handleCostKeydown(event);
    ">
    <button onclick="
        calculateTotal();
    ">Calculate</button>
    <p class="js-totalCost"></p>

    <script>

        String(25); // This will convert the 25 into a string
        console.log('25' - 5); // JS convert the 25 into number ans = 20
        console.log('25' + 5); // JS convert the 5 into string ans = 255

        window.document;
        window.console.log('Window');

        function handleCostKeydown(event){
            console.log(event.key);
            if(event.key === 'Enter'){
                calculateTotal();
            }
        }

        function calculateTotal(){
            let totalCost = 0;

            const inputElement = document.querySelector('.js-costElement');
            const cost = Number(inputElement.value); // Gives the string

            //console.log(typeof cost);

            if(cost < 40){
                totalCost = cost + 10; // We can use parseFloat(cost)
            } else {
                totalCost = cost;
            }


            document.querySelector('.js-totalCost').innerHTML = 
                `$${totalCost}`;

            //console.log(totalCost);
        }

        function subscribe() {
            const btnElement = document.querySelector('.js-subscribe-btn');

            if(btnElement.innerText === 'Subscribe'){
                btnElement.innerHTML = 'Subscribed';
            } else {
                btnElement.innerHTML = 'Subscribe';
            }
            
        }


    </script>
</body>
</html>
