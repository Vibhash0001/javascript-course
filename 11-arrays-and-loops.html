        function doubleArray(nums){
            const nums2 = [];

            for(let i=0; i<nums.length; i++){
                const num = nums[i];

                if(num == 0){
                    return nums2;
                }
                //nums2[i] = num * 2;
                nums2.push(num * 2);
            }
            return nums2;
        }
